        <style>
            /* the stage map's dark theme: black page, system type, one blue for the action */
            :root { --bg: #000000; --field: #1c1c1e; --line: rgba(255, 255, 255, 0.14); --text: #f5f5f7; --sec: #98989d; --accent: #0a84ff; --error: #ff6961; }
            * { box-sizing: border-box; }
            .staticrypt-html, .staticrypt-body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
            .hidden { display: none !important; }
            .staticrypt-content { min-height: 100%; display: flex; flex-direction: column; }
            .staticrypt-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px; }
            .staticrypt-form { width: 100%; max-width: 380px; }
            .marchio { display: flex; align-items: center; gap: 18px; margin: 0 0 36px; }
            .marchio img { width: 68px; height: auto; flex: none; }
            .marchio h1 { margin: 0; font-size: 30px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em; }
            .marchio p { margin: 6px 0 0; color: var(--sec); font-size: 17px; }
            .staticrypt-instructions { margin: 0 0 18px; color: var(--sec); font-size: 15px; line-height: 1.45; }
            .staticrypt-password-container { position: relative; margin: 0 0 14px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; }
            .staticrypt-password-container:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.3); }
            #staticrypt-password { width: 100%; padding: 15px 48px 15px 16px; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; }
            #staticrypt-password::placeholder { color: var(--sec); }
            .staticrypt-toggle-password-visibility { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; padding: 10px; box-sizing: content-box; cursor: pointer; filter: invert(1); opacity: 0.55; }
            .staticrypt-toggle-password-visibility:hover { opacity: 0.85; }
            .staticrypt-errore { margin: -4px 0 14px; color: var(--error); font-size: 14px; }
            label.staticrypt-remember { display: flex; align-items: center; gap: 10px; margin: 0 0 20px; color: var(--sec); font-size: 14px; cursor: pointer; }
            .staticrypt-remember input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
            .staticrypt-decrypt-button { width: 100%; padding: 15px; border: 0; border-radius: 12px; background: var(--accent); color: #ffffff; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
            .staticrypt-decrypt-button:hover { filter: brightness(1.1); }
            .staticrypt-decrypt-button:focus-visible, .staticrypt-remember input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
            .piede { padding: 20px 16px 28px; text-align: center; color: var(--sec); font-size: 13px; }
            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }
            .staticrypt-spinner { width: 28px; height: 28px; border: 3px solid #3a3a3c; border-right-color: transparent; border-radius: 50%; animation: giro 0.75s linear infinite; }
            @keyframes giro { to { transform: rotate(360deg); } }
            @media (prefers-reduced-motion: reduce) { .staticrypt-spinner { animation-duration: 3s; } }
        </style>
    </head>
    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>
        <div id="staticrypt_content" class="staticrypt-content hidden">
            <main class="staticrypt-page">
